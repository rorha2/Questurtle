<!-- 🐢 HTML 주석 -->

<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questurtle</title>

    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ■■■■■ 로그인 화면 ■■■■■ -->
<main id="login-screen">

    <section class="login-box">

        <div class="login-turtle">
            <img
                class="login-turtle-image"
                src="images/characters/turtle.png"
                alt="거북이">
        </div>

        <img
                class="logo-image"
                src="images/logo/questurtle-logo.png"
                alt="Questurtle">

        <input
            type="text"
            id="login-id"
            placeholder="아이디"
            autocomplete="username">

        <input
            type="password"
            id="login-password"
            placeholder="비밀번호"
            autocomplete="current-password">

        <button id="login-button">
            로그인
        </button>

        <p id="login-message"></p>

    </section>

</main>

<div id="app" style="display:none;">

    <h1 class="logo">

        <button
            type="button"
            class="logo-button"
            id="home-logo-button"
            aria-label="홈으로 이동">

            <img
                class="logo-image"
                src="images/logo/questurtle-logo.png"
                alt="Questurtle">

        </button>

    </h1>


<!-- ■■■■■ 홈 화면 ■■■■■ -->
<main id="home-screen">

    <!-- 현재 로그인 사용자 -->
    <section id="current-user-card">

        <span id="current-user-icon">
            👤
        </span>

        <span id="current-user-name">
            사용자
        </span>

    </section>

    <!-- 프로필 카드 -->
    <header class="profile">

        <div class="turtle-stage">

            <div
                class="turtle-reward"
                id="turtle-reward">
            </div>

            <div class="turtle">
                <p
                    class="turtle-speech"
                    id="turtle-speech"
                    aria-live="polite">
                </p>
                <div class="turtle-wrapper">
                    <img
                        class="turtle-character-image"
                        id="turtle-character"
                        src="images/characters/turtle.png"
                        alt="거북이">
                </div>
            </div>

        </div>

        <h2 id="profile-nickname">
        꺼북
        </h2>

        <p>
        Lv.<span id="turtle-level">1</span>
        </p>

        <p>
        [
        <span id="turtle-exp">0</span>
        /
        <span id="turtle-max-exp">2000</span>
        ]
        </p>

    </header>

    <!-- 홈 / 포인트 카드 -->
    <section class="point" id="point-card">

        <p>
        ⭐ <span class="point-number"></span> P
        </p>

    </section>

    <!-- 홈 / 메뉴 카드 -->
    <section class="menu">

        <div>

            <button class="menu-button" id="quest-button">
            퀘스트
            </button>

            <button class="menu-button" id="shop-button">
            상점
            </button>

        </div>

        <div>

            <button class="menu-button" id="bag-button">
            가방
            </button>

            <button class="menu-button" id="settings-button">
            설정
            </button>

        </div>

    </section>


</main>


<!-- ■■■■■ 포인트 화면 ■■■■■ -->
<main id="point-screen" style="display:none;">


    <nav
        class="screen-navigation"
        aria-label="화면 이동">

        <button
            type="button"
            class="navigation-button back-button"
            aria-label="뒤로가기">

            <img
                src="images/icons/back_arrow.png"
                alt="">

        </button>

        <button
            type="button"
            class="navigation-button home-button"
            aria-label="홈으로 이동">

            <img
                src="images/icons/home.png"
                alt="">

        </button>

    </nav>

    <h1>
        <img
            class="menu-icon-image"
            src="images/icons/point.png"
            alt="">
        포인트</h1>

    <section class="point">

        <p>
        ⭐ <span class="point-number"></span> P
        </p>

    </section>

    <div class="point-actions">

        <input 
            type="number"
            id="point-input"
            placeholder="포인트 입력">

        <button id="add-point">
            적립
        </button>

        <button id="use-point">
            사용
        </button>

    </div>

    <div id="point-history">

        <h3>📜 내역</h3>

    </div>


</main>

<!-- ■■■■■ 퀘스트 화면 ■■■■■ -->
<main id="quest-screen" style="display:none;">

    <nav
        class="screen-navigation"
        aria-label="화면 이동">

        <button
            type="button"
            class="navigation-button back-button"
            aria-label="뒤로가기">

            <img
                src="images/icons/back_arrow.png"
                alt="">

        </button>

        <button
            type="button"
            class="navigation-button home-button"
            aria-label="홈으로 이동">

            <img
                src="images/icons/home.png"
                alt="">

        </button>

    </nav>

        <h1>
        <img
            class="menu-icon-image"
            src="images/icons/quest.png"
            alt="">
        퀘스트</h1>

    <div id="quest-list">

    </div>

</main>


<!-- ■■■■■ 상점 화면 ■■■■■ -->
<main id="shop-screen" style="display:none;">

    <nav
        class="screen-navigation"
        aria-label="화면 이동">

        <button
            type="button"
            class="navigation-button back-button"
            aria-label="뒤로가기">

            <img
                src="images/icons/back_arrow.png"
                alt="">

        </button>

        <button
            type="button"
            class="navigation-button home-button"
            aria-label="홈으로 이동">

            <img
                src="images/icons/home.png"
                alt="">

        </button>

    </nav>

        <h1>
        <img
            class="menu-icon-image"
            src="images/icons/shop.png"
            alt="">
        상점</h1>

    <section class="point">

        <p>
        ⭐ <span class="point-number"></span> P
        </p>

    </section>

    <section id="shop-list">

    </section>

</main>


<!-- ■■■■■ 가방 화면 ■■■■■ -->
<main id="bag-screen" style="display:none;">

    <nav
        class="screen-navigation"
        aria-label="화면 이동">

        <button
            type="button"
            class="navigation-button back-button"
            aria-label="뒤로가기">

            <img
                src="images/icons/back_arrow.png"
                alt="">

        </button>

        <button
            type="button"
            class="navigation-button home-button"
            aria-label="홈으로 이동">

            <img
                src="images/icons/home.png"
                alt="">

        </button>

    </nav>

        <h1>
            <img
            class="menu-icon-image"
            src="images/icons/bag.png"
            alt="">
        가방</h1>

    <section id="bag-list">

    </section>

</main>


<!-- ■■■■■ 설정 화면 ■■■■■ -->
<main id="settings-screen" style="display:none;">

    <nav
        class="screen-navigation"
        aria-label="화면 이동">

        <button
            type="button"
            class="navigation-button back-button"
            aria-label="뒤로가기">

            <img
                src="images/icons/back_arrow.png"
                alt="">

        </button>

        <button
            type="button"
            class="navigation-button home-button"
            aria-label="홈으로 이동">

            <img
                src="images/icons/home.png"
                alt="">

        </button>

    </nav>

        <h1>
            <img
            class="menu-icon-image"
            src="images/icons/settings.png"
            alt="">
        설정</h1>

    <section class="settings-list">

        <div class="setting-item">
            <span>🔊 효과음</span>
            <button id="sound-button">ON</button>
        </div>

        <div class="setting-item">
            <span>🎵 배경음</span>
            <button id="music-button">ON</button>
        </div>

        <div class="setting-item">
            <span>🎨 테마</span>
            <button id="theme-button">기본</button>
        </div>

    </section>

    <hr class="settings-divider">

    <button class="menu-button" id="admin-button">
        🔒 관리자
    </button>

    <div class="settings-actions">

    <button
        class="menu-button"
        id="profile-edit-button">
        프로필 수정
    </button>

    <button
        class="menu-button"
        id="logout-button">
        로그아웃
    </button>

    </div>

</main>

<!-- ■■■■■ 프로필 수정 화면 ■■■■■ -->
<main id="profile-edit-screen" style="display:none;">

    <nav
        class="screen-navigation"
        aria-label="화면 이동">

        <button
            type="button"
            class="navigation-button"
            id="profile-edit-back-button"
            aria-label="설정으로 돌아가기">

            <img
                src="images/icons/back_arrow.png"
                alt="">

        </button>

        <button
            type="button"
            class="navigation-button home-button"
            aria-label="홈으로 이동">

            <img
                src="images/icons/home.png"
                alt="">

        </button>

    </nav>

        <h1>프로필 수정</h1>

        <section class="profile-edit-form">

            <label for="profile-nickname-input">
                사용자명
            </label>

            <button
                type="button"
                class="profile-icon-button"
                id="profile-icon-button">

                <span id="profile-icon-preview">
                    👤
                </span>

                <span>아이콘 변경</span>
            </button>

            <input
                type="text"
                id="profile-nickname-input"
                placeholder="사용자명">

            <label for="profile-turtle-name-input">
                거북이 이름
            </label>

            <input
                type="text"
                id="profile-turtle-name-input"
                placeholder="거북이 이름">

        </section>

        <div class="profile-edit-actions">

            <button
                class="menu-button"
                id="profile-edit-cancel-button">
                취소
            </button>

            <button
                class="menu-button"
                id="profile-edit-save-button">
                저장
            </button>

        </div>

</main>

<!-- ■■■■■ 아이콘 선택 팝업 ■■■■■ -->
<div
    class="modal-overlay"
    id="profile-icon-modal"
    aria-hidden="true"
    style="display:none;">

    <section
        class="modal-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-icon-title">

        <h2 id="profile-icon-title">
            아이콘 선택
        </h2>

        <div class="profile-icon-options">

            <button type="button" class="profile-icon-option" data-icon="❤️" aria-label="빨간 하트">❤️</button>
            <button type="button" class="profile-icon-option" data-icon="🩷" aria-label="분홍 하트">🩷</button>
            <button type="button" class="profile-icon-option" data-icon="🧡" aria-label="주황 하트">🧡</button>
            <button type="button" class="profile-icon-option" data-icon="💛" aria-label="노란 하트">💛</button>
            <button type="button" class="profile-icon-option" data-icon="💚" aria-label="초록 하트">💚</button>
            <button type="button" class="profile-icon-option" data-icon="🩵" aria-label="하늘색 하트">🩵</button>
            <button type="button" class="profile-icon-option" data-icon="💙" aria-label="파란 하트">💙</button>
            <button type="button" class="profile-icon-option" data-icon="💜" aria-label="보라 하트">💜</button>
            <button type="button" class="profile-icon-option" data-icon="🤍" aria-label="흰색 하트">🤍</button>
            <button type="button" class="profile-icon-option" data-icon="🖤" aria-label="검은 하트">🖤</button>

        </div>

        <label
            class="profile-photo-upload-button"
            for="profile-photo-input">
            프로필 사진 첨부
        </label>

        <input
            type="file"
            id="profile-photo-input"
            accept="image/*">

    </section>

</div>


<!-- ■■■■■ 테마 선택 팝업 ■■■■■ -->
<div
    class="modal-overlay"
    id="theme-modal"
    aria-hidden="true"
    style="display:none;">

    <section
        class="modal-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="theme-modal-title">

        <h2 id="theme-modal-title">
            테마 선택
        </h2>

        <div
            class="theme-options"
            id="theme-options">
        </div>

    </section>

</div>


<!-- ■■■■■ 관리자 화면 ■■■■■ -->
<main id="admin-screen" style="display:none;">

    <nav
        class="screen-navigation"
        aria-label="화면 이동">

        <button
            type="button"
            class="navigation-button back-button"
            data-back-target="settings-screen"
            aria-label="설정으로 돌아가기">

            <img
                src="images/icons/back_arrow.png"
                alt="">

        </button>

        <button
            type="button"
            class="navigation-button home-button"
            aria-label="홈으로 이동">

            <img
                src="images/icons/home.png"
                alt="">

        </button>

    </nav>

    <h1>🔒 관리자</h1>

    <p>관리자 비밀번호를 입력하세요.</p>

    <input
        type="password"
        id="admin-password"
        placeholder="비밀번호">

    <button class="menu-button" id="admin-login-button">
        확인
    </button>

</main>


<!-- 현재 버전 -->
<footer class="ver">
    0.93 Ver
</footer>

</div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/elements.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/point.js"></script>
<script src="js/ui.js"></script>
<script src="js/quest.js"></script>
<script src="js/shop.js"></script>
<script src="js/bag.js"></script>
<script src="js/app.js"></script>
<script src="js/turtle-dialogue.js"></script>
<script src="js/turtle.js"></script>
<script src="js/turtle-interaction.js"></script>


</body>

</html>
